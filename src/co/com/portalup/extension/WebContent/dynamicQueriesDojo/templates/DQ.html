<div class="ecmCenterPane dqPane">
	<div data-dojo-type="idx/layout/BorderContainer"
		data-dojo-attach-point="mainContainer"
		data-dojo-props="gutters:false, liveSplitters:true"
		class="dqMainContainer">

		<!-- Panel izquierdo: repositorio, nueva consulta, filtro y árbol de consultas -->
		<div data-dojo-type="dijit/layout/ContentPane"
			data-dojo-attach-point="navPane"
			data-dojo-props="region:'leading', splitter:true"
			class="dqNavPane">
			<div data-dojo-attach-point="repositorySelectorArea" class="dqRepositorySelector"></div>
			<div class="dqNewQueryRow">
				<a href="#" role="button" class="dqLink"
					data-dojo-attach-point="newQueryLink"
					data-dojo-attach-event="onclick: _onNewQueryClick">Nueva consulta</a>
			</div>
			<div class="dqFilterRow">
				<input data-dojo-type="dijit/form/TextBox"
					data-dojo-attach-point="filterBox"
					data-dojo-attach-event="onChange: _onFilterChange"
					data-dojo-props="placeHolder:'Nombre de la consulta...', intermediateChanges:true, trim:true"
					aria-label="Filtrar consultas por nombre"
					class="dqFilterBox" />
			</div>
			<div data-dojo-attach-point="treeNode" class="dqTree"></div>
			<div data-dojo-attach-point="treeMessageNode" class="dqTreeMessage" role="status"></div>
		</div>

		<!-- Área central: estado vacío o pestañas de consultas -->
		<div data-dojo-type="dijit/layout/StackContainer"
			data-dojo-attach-point="centerStack"
			data-dojo-props="region:'center'"
			class="dqCenter">
			<div data-dojo-type="dijit/layout/ContentPane"
				data-dojo-attach-point="emptyPane"
				class="dqEmptyPane">
				<div class="dqEmptyState">
					<h2 class="dqEmptyTitle">Consultas dinámicas</h2>
					<p>Seleccione una consulta del árbol o cree una con <strong>Nueva consulta</strong>.</p>
				</div>
			</div>
			<div data-dojo-type="dijit/layout/TabContainer"
				data-dojo-attach-point="tabContainer"
				data-dojo-props="useMenu:false, useSlider:true"
				class="dqTabs"></div>
		</div>
	</div>
</div>
